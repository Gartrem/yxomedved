name: Verify site

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Check responsive layout and interactions
        run: |
          python3 -m http.server 4173 &
          cat > verify.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            for (const width of [375, 390, 430, 768, 1440]) {
              const page = await browser.newPage({ viewport: { width, height: 844 } });
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              if (response?.status() !== 200) throw new Error(`HTTP ${response?.status()} at ${width}px`);
              const state = await page.evaluate(() => ({
                overflow: document.documentElement.scrollWidth > innerWidth + 1,
                logo: document.querySelector('.brand img')?.naturalWidth > 0,
                hero: document.querySelector('.hero-image')?.naturalWidth > 0,
                h1: !!document.querySelector('h1'),
                links: [...document.querySelectorAll('a[href^="#"]')].every(a => document.querySelector(a.getAttribute('href'))),
              }));
              if (state.overflow || !state.logo || !state.hero || !state.h1 || !state.links || errors.length) {
                throw new Error(`Failed at ${width}px: ${JSON.stringify({ state, errors })}`);
              }
              if (width < 1050) {
                await page.locator('.menu-toggle').click();
                if (!(await page.locator('.drawer').isVisible())) throw new Error(`Menu did not open at ${width}px`);
                await page.keyboard.press('Escape');
                if (await page.locator('.drawer').isVisible()) throw new Error(`Menu did not close at ${width}px`);
              }
              await page.close();
            }
          } finally { await browser.close(); }
          NODE
          node verify.mjs
