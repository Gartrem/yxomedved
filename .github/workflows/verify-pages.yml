name: Verify live website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify mirrors and static structure
        shell: bash
        run: |
          set -euo pipefail
          cmp index.html docs/index.html
          cmp redesign.css docs/redesign.css
          cmp redesign.js docs/redesign.js
          cmp catalog.html docs/catalog.html
          cmp catalog.css docs/catalog.css
          cmp catalog.js docs/catalog.js
          ! grep -q "studioVisual" catalog.js
          ! grep -q "restoreBarSprites" catalog.js
          ! grep -q "IntersectionObserver" catalog.js
          ! grep -q "scrollIntoView" catalog.js
          test "$(grep -o 'class="menu-item food"' catalog.html | wc -l)" -eq 43
          test "$(grep -o 'class="menu-item bar"' catalog.html | wc -l)" -eq 174
          test "$(grep -o 'class="bar-mark"' catalog.html | wc -l)" -eq 174
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify local pages and scroll stability
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/yxo-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > check.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
              const page=await browser.newPage({viewport});
              const response=await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
              if(response?.status()!==200) throw new Error('index failed');
              const indexCheck=await page.evaluate(()=>({
                overflow:document.documentElement.scrollWidth>innerWidth+1,
                logo:[...document.images].some(img=>img.src.includes('logo-glossy.png')&&img.naturalWidth>0)
              }));
              if(indexCheck.overflow||!indexCheck.logo) throw new Error('index layout '+JSON.stringify(indexCheck));

              await page.goto('http://127.0.0.1:4173/catalog.html?tab=food',{waitUntil:'networkidle'});
              const base=await page.evaluate(()=>({
                food:document.querySelectorAll('.menu-item.food').length,
                bar:document.querySelectorAll('.menu-item.bar').length,
                overflow:document.documentElement.scrollWidth>innerWidth+1
              }));
              if(base.food!==43||base.bar!==174||base.overflow) throw new Error('catalog structure '+JSON.stringify(base));

              const positions=[];
              const max=await page.evaluate(()=>document.documentElement.scrollHeight-innerHeight);
              for(let y=0;y<=max;y+=Math.max(220,Math.floor(viewport.height*.65))){
                await page.evaluate(y=>scrollTo(0,y),y);
                await page.waitForTimeout(35);
                positions.push(await page.evaluate(()=>scrollY));
              }
              for(let i=1;i<positions.length;i++){
                if(positions[i]+4<positions[i-1]) throw new Error('passive scroll jumped '+JSON.stringify(positions.slice(Math.max(0,i-3),i+2)));
              }

              await page.locator('#search').fill('том ям');
              await page.waitForTimeout(50);
              const visible=await page.evaluate(()=>[...document.querySelectorAll('.menu-item.food')].filter(x=>!x.hidden&&x.offsetParent!==null).length);
              if(visible<1) throw new Error('food search failed');
              await page.close();
            }
          }finally{await browser.close()}
          NODE
          node check.mjs
