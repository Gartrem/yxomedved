name: Verify restored design

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Check restored live design
        run: |
          cat > check.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const [name,viewport] of Object.entries({mobile:{width:390,height:844},desktop:{width:1440,height:900}})){
              const page=await browser.newPage({viewport});
              const res=await page.goto('https://gartrem.github.io/yxomedved/?restore='+Date.now(),{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(1200);
              const data=await page.evaluate(()=>{
                const logo=document.querySelector('.brand img');
                const h1=document.querySelector('.hero h1');
                const cards=[...document.querySelectorAll('.signature-card')];
                return {
                  marker:document.querySelector('meta[name="build-version"]')?.content||null,
                  logoSrc:logo?.getAttribute('src')||null,
                  logoNatural:[logo?.naturalWidth||0,logo?.naturalHeight||0],
                  title:h1?.innerText||null,
                  cards:cards.length,
                  customFeatureSvgs:cards.reduce((n,c)=>n+c.querySelectorAll('svg').length,0),
                  dock:getComputedStyle(document.querySelector('.mobile-actions')).display,
                  overflow:document.documentElement.scrollWidth>innerWidth+1
                };
              });
              data.http=res?.status()||null;
              console.log(name.toUpperCase()+'_RESTORED='+JSON.stringify(data));
              const ok=data.http===200
                && data.marker==='20260921-logo-v4'
                && data.logoSrc.includes('logo.svg')
                && /Больше/.test(data.title||'')
                && data.cards===4
                && data.customFeatureSvgs>=4
                && !data.overflow;
              if(!ok) throw new Error('Restored design check failed: '+JSON.stringify(data));
              await page.close();
            }
          }finally{await browser.close();}
          NODE
          node check.mjs
