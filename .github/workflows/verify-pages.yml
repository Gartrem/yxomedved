name: Verify favicon live

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Check live favicon
        run: |
          cat > check.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const res=await page.goto('https://gartrem.github.io/yxomedved/?favicon='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1200);
            const data=await page.evaluate(async()=>{
              const icon=document.querySelector('link[rel="icon"]');
              const shortcut=document.querySelector('link[rel="shortcut icon"]');
              const apple=document.querySelector('link[rel="apple-touch-icon"]');
              const href=icon?.getAttribute('href')||'';
              let assetOk=false;
              if(href){
                const r=await fetch(href+'&check='+Date.now(),{cache:'no-store'});
                const bytes=await r.arrayBuffer();
                assetOk=r.ok && bytes.byteLength>50000;
              }
              return {
                icon:href,
                shortcut:shortcut?.getAttribute('href')||null,
                apple:apple?.getAttribute('href')||null,
                assetOk,
                overflow:document.documentElement.scrollWidth>innerWidth+1
              };
            });
            data.http=res?.status()||null;
            console.log('FAVICON_LIVE='+JSON.stringify(data));
            const ok=data.http===200
              && data.icon.includes('logo-glossy.png')
              && data.shortcut?.includes('logo-glossy.png')
              && data.apple?.includes('logo-glossy.png')
              && data.assetOk
              && !data.overflow;
            if(!ok) throw new Error('Favicon live check failed: '+JSON.stringify(data));
          } finally {
            await browser.close();
          }
          NODE
          node check.mjs
