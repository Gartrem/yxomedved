name: Verify item images live

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Check live item images
        run: |
          cat > check.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const base='https://gartrem.github.io/yxomedved/';
          async function inspect(path,expected,term){
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const res=await page.goto(base+path+'?allphotos='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1600);
            const data=await page.evaluate(async()=>{
              const items=[...document.querySelectorAll('.item')];
              const imgs=items.map(x=>x.querySelector('.item-photo')).filter(Boolean);
              const checks=await Promise.all(imgs.map(async img=>{
                const src=img.src;
                try{
                  const r=await fetch(src+(src.includes('?')?'&':'?')+'probe='+Date.now(),{cache:'no-store'});
                  const b=await r.arrayBuffer();
                  return {ok:r.ok,size:b.byteLength};
                }catch(e){return {ok:false,size:0}}
              }));
              return {items:items.length,imgs:imgs.length,ok:checks.filter(x=>x.ok&&x.size>4000).length,overflow:document.documentElement.scrollWidth>innerWidth+1};
            });
            await page.locator('#q').fill(term); await page.waitForTimeout(120);
            const visible=await page.evaluate(()=>[...document.querySelectorAll('.item')].filter(x=>!x.hidden).length);
            console.log(path.toUpperCase()+'='+JSON.stringify({http:res?.status(),data,visible}));
            if(res?.status()!==200||data.items!==expected||data.imgs!==expected||data.ok!==expected||data.overflow||visible<1)
              throw new Error(path+' verification failed '+JSON.stringify({data,visible,http:res?.status()}));
            await page.close();
          }
          try{
            await inspect('menu.html',43,'том ям');
            await inspect('bar.html',174,'negroni');
          }finally{await browser.close();}
          NODE
          node check.mjs
