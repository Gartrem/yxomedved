name: Quick live logo check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect deployed page
        run: |
          cat > check.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const [name,viewport] of Object.entries({mobile:{width:390,height:844},desktop:{width:1440,height:900}})){
              const page=await browser.newPage({viewport});
              const res=await page.goto('https://gartrem.github.io/yxomedved/?quick='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1500);
              const data=await page.evaluate(()=>{
                const logo=document.querySelector('.brand img');
                const r=logo?.getBoundingClientRect();
                return {
                  marker:document.querySelector('meta[name="build-version"]')?.content||null,
                  logoSrc:logo?.getAttribute('src')||null,
                  natural:[logo?.naturalWidth||0,logo?.naturalHeight||0],
                  rendered:[r?.width||0,r?.height||0],
                  overflow:document.documentElement.scrollWidth>innerWidth+1
                };
              });
              data.http=res?.status()||null;
              console.log(name.toUpperCase()+'_LIVE='+JSON.stringify(data));
              const ok=data.http===200 && data.logoSrc.includes('logo-white-hq.webp') && data.natural[0]>=700 && data.natural[1]>=450 && !data.overflow;
              if(!ok) throw new Error('Live check failed: '+JSON.stringify(data));
              await page.close();
            }
          }finally{await browser.close();}
          NODE
          node check.mjs
