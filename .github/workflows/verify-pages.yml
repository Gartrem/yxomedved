name: Verify integrated menus

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Check live menu pages
        run: |
          cat > check.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const base='https://gartrem.github.io/yxomedved/';
          async function inspect(path,expectedTitle,minItems,searchTerm){
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const res=await page.goto(base+path+'?check='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1200);
            const before=await page.evaluate(()=>({
              title:document.title,
              h1:document.querySelector('.mp-hero h1')?.innerText||'',
              items:document.querySelectorAll('.item').length,
              logo:document.querySelector('.mp-head img')?.getAttribute('src')||'',
              visuals:document.querySelectorAll('.menu-visual').length,
              loadedVisuals:[...document.querySelectorAll('.menu-visual img')].filter(img=>img.complete&&img.naturalWidth>0).length,
              categoryPhotos:document.querySelectorAll('.cat-photo').length,
              loadedCategoryPhotos:[...document.querySelectorAll('.cat-photo img')].filter(img=>img.complete&&img.naturalWidth>0).length,
              categoryPhotoSrcs:[...document.querySelectorAll('.cat-photo img')].map(img=>img.getAttribute('src')),
              overflow:document.documentElement.scrollWidth>innerWidth+1
            }));
            const categoryAssets = await page.evaluate(async()=>{
              const srcs=[...document.querySelectorAll('.cat-photo img')].map(img=>img.src);
              return Promise.all(srcs.map(async src=>{
                try{
                  const r=await fetch(src+'?assetcheck='+Date.now(),{cache:'no-store'});
                  const bytes=await r.arrayBuffer();
                  return {src,ok:r.ok,size:bytes.byteLength};
                }catch(e){ return {src,ok:false,size:0}; }
              }));
            });
            await page.locator('#q').fill(searchTerm);
            await page.waitForTimeout(200);
            const after=await page.evaluate(()=>({
              visible:[...document.querySelectorAll('.item')].filter(x=>!x.hidden).length,
              emptyHidden:document.querySelector('#empty')?.hidden
            }));
            console.log(path.toUpperCase()+'='+JSON.stringify({http:res?.status(),before,categoryAssets,after}));
            const ok=res?.status()===200
              && before.title.includes(expectedTitle)
              && before.items>=minItems
              && before.logo.includes('logo-glossy.png')
              && (path==='menu.html'
                    ? (before.categoryPhotos===9 && categoryAssets.length===9 && categoryAssets.every(x=>x.ok&&x.size>5000))
                    : (before.visuals>=3 && before.loadedVisuals>=3))
              && !before.overflow
              && after.visible>=1
              && after.emptyHidden===true;
            if(!ok) throw new Error(path+' failed: '+JSON.stringify({before,categoryAssets,after,http:res?.status()}));
            await page.close();
          }
          try{
            const home=await browser.newPage({viewport:{width:390,height:844}});
            const hr=await home.goto(base+'?menus='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            const links=await home.evaluate(()=>({
              kitchen:document.querySelector('.menu-actions a[href="menu.html"]')?.getAttribute('href')||null,
              bar:document.querySelector('.menu-actions a[href="bar.html"]')?.getAttribute('href')||null
            }));
            console.log('HOME_LINKS='+JSON.stringify({http:hr?.status(),links}));
            if(hr?.status()!==200||!links.kitchen||!links.bar) throw new Error('Homepage menu links missing');
            await home.close();
            await inspect('menu.html','Меню кухни',35,'том ям');
            await inspect('bar.html','Барная карта',90,'negroni');
          }finally{await browser.close();}
          NODE
          node check.mjs
