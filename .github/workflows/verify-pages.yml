name: Verify mobile newline fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Check live mobile page
        run: |
          cat > check.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const res=await page.goto('https://gartrem.github.io/yxomedved/?newline='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1200);
            const data=await page.evaluate(()=>{
              const bodyText=document.body.innerText||'';
              const html=document.documentElement.outerHTML;
              const header=document.querySelector('.site-header');
              const logo=document.querySelector('.brand img');
              return {
                marker:document.querySelector('meta[name="build-version"]')?.content||null,
                hasLiteralEscapedNewline:bodyText.includes('\\n'),
                htmlHasLiteralEscapedNewline:html.includes('\\n'),
                topText:bodyText.slice(0,80),
                logoSrc:logo?.getAttribute('src')||null,
                headerTop:header?.getBoundingClientRect().top||0,
                overflow:document.documentElement.scrollWidth>innerWidth+1
              };
            });
            data.http=res?.status()||null;
            console.log('NEWLINE_FIX_LIVE='+JSON.stringify(data));
            const ok=data.http===200
              && data.marker==='20260921-mobile-newline-fix'
              && !data.hasLiteralEscapedNewline
              && !data.htmlHasLiteralEscapedNewline
              && data.logoSrc.includes('logo-glossy.png')
              && !data.overflow;
            if(!ok) throw new Error('Mobile newline fix failed: '+JSON.stringify(data));
          } finally {
            await browser.close();
          }
          NODE
          node check.mjs
