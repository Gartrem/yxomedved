name: Verify item photos

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Check every menu item has an image
        run: |
          cat > check.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const base='https://gartrem.github.io/yxomedved/';
          async function inspect(path,expectedCount,searchTerm){
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const res=await page.goto(base+path+'?itemphotos='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1800);
            const data=await page.evaluate(async()=>{
              const items=[...document.querySelectorAll('.item')];
              const imgs=items.map(x=>x.querySelector('.item-photo')).filter(Boolean);
              const networkSrcs=imgs.map(x=>x?.src||'').filter(s=>s && !s.startsWith('data:'));
              const assetChecks=await Promise.all(networkSrcs.map(async src=>{
                try{
                  const r=await fetch(src+(src.includes('?')?'&':'?')+'check='+Date.now(),{cache:'no-store'});
                  const b=await r.arrayBuffer(); return {ok:r.ok,size:b.byteLength};
                }catch(e){return {ok:false,size:0}}
              }));
              return {
                count:items.length,
                imgCount:imgs.length,
                complete:imgs.filter(x=>x.complete&&x.naturalWidth>0).length,
                dataImages:imgs.filter(x=>(x.src||'').startsWith('data:image/')).length,
                networkImages:networkSrcs.length,
                assetsOk:assetChecks.every(x=>x.ok&&x.size>5000),
                overflow:document.documentElement.scrollWidth>innerWidth+1
              };
            });
            await page.locator('#q').fill(searchTerm);
            await page.waitForTimeout(150);
            const visible=await page.evaluate(()=>[...document.querySelectorAll('.item')].filter(x=>!x.hidden).length);
            console.log(path.toUpperCase()+'='+JSON.stringify({http:res?.status(),data,visible}));
            const isBar=path==='bar.html';
            const ok=res?.status()===200 && data.count===expectedCount && data.imgCount===expectedCount
              && (isBar ? data.dataImages===expectedCount : (data.networkImages===expectedCount && data.assetsOk))
              && !data.overflow && visible>=1;
            if(!ok) throw new Error(path+' failed '+JSON.stringify({data,visible,http:res?.status()}));
            await page.close();
          }
          try{
            await inspect('menu.html',43,'том ям');
            await inspect('bar.html',174,'negroni');
          }finally{await browser.close();}
          NODE
          node check.mjs
