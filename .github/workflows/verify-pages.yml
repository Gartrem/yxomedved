name: Verify live GitHub Pages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify live page
        run: |
          cat > /tmp/verify.mjs <<'NODE'
          import { chromium } from 'playwright';

          const url = 'https://gartrem.github.io/yxomedved/?verify=' + Date.now();
          const expectedMarker = '20260920-verify-1';
          const browser = await chromium.launch({headless:true});
          const report = { checkedAt:new Date().toISOString(), url, expectedMarker, desktop:{}, mobile:{}, pass:false, errors:[] };

          async function inspect(viewport, mode) {
            const page = await browser.newPage({viewport});
            const response = await page.goto(url,{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1200);
            const data = await page.evaluate(() => {
              const q=s=>document.querySelector(s);
              const cs=s=>q(s)?getComputedStyle(q(s)):null;
              const cards=[...document.querySelectorAll('.signature-card')];
              const logo=q('.brand img');
              return {
                title:document.title,
                buildVersion:q('meta[name="build-version"]')?.content||null,
                viewportWidth:innerWidth,
                documentWidth:document.documentElement.scrollWidth,
                headerHeight:q('.site-header')?.getBoundingClientRect().height||null,
                logoNaturalWidth:logo?.naturalWidth||null,
                logoNaturalHeight:logo?.naturalHeight||null,
                navDisplay:cs('.desktop-nav')?.display||null,
                headerSideDisplay:cs('.header-side')?.display||null,
                menuButtonDisplay:cs('.menu-btn')?.display||null,
                heroBackground:cs('.hero-bg')?.backgroundImage||null,
                signatureCards:cards.length,
                inlineSvgIcons:cards.reduce((n,c)=>n+c.querySelectorAll('svg').length,0),
                heroH1:q('.hero h1')?.innerText||null,
                reserveButtons:document.querySelectorAll('.reserve').length
              };
            });
            data.httpStatus=response?.status()||null;
            data.noHorizontalOverflow=data.documentWidth<=data.viewportWidth+1;
            report[mode]=data;
            await page.close();
          }

          try{
            await inspect({width:1440,height:900},'desktop');
            await inspect({width:390,height:844},'mobile');
            const d=report.desktop,m=report.mobile;
            report.checks={
              liveMarker:d.buildVersion===expectedMarker&&m.buildVersion===expectedMarker,
              httpOk:d.httpStatus===200&&m.httpStatus===200,
              logoLoaded:d.logoNaturalWidth>0&&d.logoNaturalHeight>0,
              premiumHeroActive:(d.heroBackground||'').includes('hero-premium.webp'),
              bespokeIcons:d.signatureCards===4&&d.inlineSvgIcons===4,
              desktopHeader:d.navDisplay!=='none'&&d.headerSideDisplay!=='none',
              mobileHeader:m.navDisplay==='none'&&m.headerSideDisplay==='none'&&m.menuButtonDisplay!=='none',
              noDesktopOverflow:d.noHorizontalOverflow,
              noMobileOverflow:m.noHorizontalOverflow,
              heroCopyPresent:/Больше/.test(d.heroH1||''),
              bookingPresent:d.reserveButtons>=3
            };
            report.pass=Object.values(report.checks).every(Boolean);
          }catch(e){report.errors.push(String(e?.stack||e));}
          finally{await browser.close();}

          console.log('PAGES_VERIFY_REPORT='+JSON.stringify(report));
          if(!report.pass) process.exit(2);
          NODE
          node /tmp/verify.mjs
