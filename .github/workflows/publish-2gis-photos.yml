name: Publish selected 2GIS photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-2gis-photos.yml'

permissions:
  contents: write

concurrency:
  group: publish-2gis-photos
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build final venue photo set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/venue docs/assets/venue

          cp assets/venue/2gis/candidate-09.webp assets/venue/hero-2gis.webp
          cp assets/venue/2gis/candidate-05.webp assets/venue/stage-2gis.webp
          cp assets/venue/2gis/candidate-03.webp assets/venue/event-2gis.webp
          cp assets/venue/2gis/candidate-01.webp assets/venue/bar-2gis.webp
          cp assets/venue/2gis/candidate-10.webp assets/venue/kitchen-2gis.webp
          cp assets/venue/2gis/candidate-16.webp assets/venue/party-2gis.webp
          cp assets/venue/2gis/candidate-11.webp assets/venue/lounge-2gis.webp
          cp assets/venue/2gis/candidate-18.webp assets/venue/nightlife-2gis.webp

          cp assets/venue/*-2gis.webp docs/assets/venue/

      - name: Wire selected photos into the site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          html = html.replace('redesign.css?v=premium-cta-v11','redesign.css?v=venue-photos-v12')
          html = html.replace('assets/interior-1100.webp" alt="Интерьер и сцена караоке-бара"',
                              'assets/venue/stage-2gis.webp" alt="Живая сцена караоке-бара Ухо & Медведь"')
          html = html.replace('assets/menu/items/food-025.jpg" alt="Блюдо кухни"',
                              'assets/venue/kitchen-2gis.webp" alt="Блюдо кухни Ухо & Медведь"')
          html = html.replace('assets/cocktail-960.webp" alt="Напиток из бара"',
                              'assets/venue/bar-2gis.webp" alt="Коктейль в баре Ухо & Медведь"')
          html = html.replace('assets/hero.jpg" alt="Атмосфера Ухо & Медведь"',
                              'assets/venue/party-2gis.webp" alt="Гости Ухо & Медведь"')
          html = html.replace('assets/cocktail-520.webp" alt="Барная атмосфера"',
                              'assets/venue/lounge-2gis.webp" alt="Вечер в Ухо & Медведь"')
          html = html.replace('assets/menu/items/food-031.jpg" alt="Кухня Ухо & Медведь"',
                              'assets/venue/nightlife-2gis.webp" alt="Ночная атмосфера Ухо & Медведь"')
          Path('index.html').write_text(html, encoding='utf-8')
          Path('docs/index.html').write_text(html, encoding='utf-8')

          css = Path('redesign.css').read_text(encoding='utf-8')
          css = css.replace('background:url("assets/hero-premium.webp") 66% 35%/cover no-repeat',
                            'background:url("assets/venue/hero-2gis.webp") 58% 42%/cover no-repeat')
          css = css.replace(
              '.event-one:before{background:radial-gradient(circle at 60% 18%,rgba(181,25,58,.3),transparent 22%),linear-gradient(145deg,#18080d,#080504 68%)}',
              '.event-one:before{background:linear-gradient(180deg,rgba(8,5,4,.08),rgba(8,5,4,.72)),url("assets/venue/event-2gis.webp") center/cover no-repeat}')
          css = css.replace(
              '.event-two:before{background:radial-gradient(circle at 46% 15%,rgba(66,62,119,.27),transparent 24%),linear-gradient(145deg,#0c0a13,#070504 68%)}',
              '.event-two:before{background:linear-gradient(180deg,rgba(8,5,4,.10),rgba(8,5,4,.74)),url("assets/venue/party-2gis.webp") center/cover no-repeat}')
          css = css.replace(
              '.event-three:before{background:radial-gradient(circle at 70% 20%,rgba(163,86,40,.24),transparent 24%),linear-gradient(145deg,#160c08,#070504 68%)}',
              '.event-three:before{background:linear-gradient(180deg,rgba(8,5,4,.10),rgba(8,5,4,.74)),url("assets/venue/lounge-2gis.webp") center/cover no-repeat}')
          css = css.replace(
              '.experience-visual img{width:100%;height:100%;object-fit:cover;',
              '.experience-visual img{width:100%;height:100%;object-fit:cover;object-position:center 38%;')
          css = css.replace(
              '.menu-shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;',
              '.menu-shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;')
          css = css.replace(
              '.gallery-grid img{width:100%;height:100%;object-fit:cover;',
              '.gallery-grid img{width:100%;height:100%;object-fit:cover;object-position:center;')
          Path('redesign.css').write_text(css, encoding='utf-8')
          Path('docs/redesign.css').write_text(css, encoding='utf-8')
          PY

      - name: Verify selected assets and mirrors
        shell: bash
        run: |
          set -euo pipefail
          for f in hero stage event bar kitchen party lounge nightlife; do
            test -s "assets/venue/${f}-2gis.webp"
            test -s "docs/assets/venue/${f}-2gis.webp"
          done
          cmp index.html docs/index.html
          cmp redesign.css docs/redesign.css
          grep -q 'assets/venue/hero-2gis.webp' redesign.css
          grep -q 'assets/venue/stage-2gis.webp' index.html
          grep -q 'assets/venue/bar-2gis.webp' index.html
          grep -q 'assets/venue/kitchen-2gis.webp' index.html

      - name: Remove temporary importer material
        shell: bash
        run: |
          rm -rf assets/venue/2gis
          rm -f .github/workflows/import-2gis-photos.yml
          rm -f .github/workflows/publish-2gis-photos.yml

      - name: Commit published venue photography
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish curated 2GIS venue photography"
          git push
