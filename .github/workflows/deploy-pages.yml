name: Verify committed menu assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/logo-glossy.png
          test -s assets/hero-premium.webp
          test -s assets/interior-1100.webp
          test -s assets/menu/items/food-001.jpg
          test -s assets/menu/items/food-043.jpg
          echo "Assets are committed. No synthetic bar artwork is generated by CI."
