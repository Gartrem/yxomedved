name: Build and publish site

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: true

jobs:
  build_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build every food and bar image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet pillow

          mkdir -p assets/menu/items assets/bar/items

          python3 - <<'PY' > /tmp/yandex_download_url.txt
          import json, urllib.parse, urllib.request
          public = "https://disk.yandex.ru/i/AwPCn1kzQHqeXw"
          api = "https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=" + urllib.parse.quote(public, safe="")
          with urllib.request.urlopen(api, timeout=30) as r:
              print(json.load(r)["href"])
          PY
          curl -fL --retry 3 "$(cat /tmp/yandex_download_url.txt)" -o /tmp/kitchen-menu.pdf
          pdftoppm -jpeg -r 120 -jpegopt quality=90 /tmp/kitchen-menu.pdf /tmp/food-page >/dev/null 2>&1

          python3 - <<'PY'
          from PIL import Image, ImageFilter, ImageDraw, ImageFont, ImageChops
          from pathlib import Path
          from html.parser import HTMLParser
          import hashlib, math, re, textwrap

          # ---------------- FOOD: 43 real crops from source menu ----------------
          out=Path("assets/menu/items"); out.mkdir(parents=True,exist_ok=True)
          crops=[
          (2,(.46,.02,.99,.34)),(2,(.00,.52,.48,.96)),(2,(.26,.36,.76,.69)),(2,(.47,.55,.99,.96)),(3,(.10,.20,.97,.94)),
          (4,(.43,.02,.99,.43)),(4,(.23,.46,.99,.97)),(5,(.08,.02,.91,.35)),(5,(.08,.33,.91,.66)),(5,(.08,.63,.91,.97)),
          (6,(.02,.18,.51,.55)),(6,(.44,.02,.99,.42)),(6,(.49,.48,.99,.98)),(6,(.02,.52,.52,.98)),
          (7,(.01,.06,.55,.49)),(7,(.46,.12,.99,.59)),(7,(.01,.53,.64,.98)),
          (8,(.10,.60,.98,.99)),(8,(.12,.01,.98,.40)),(8,(.16,.31,.99,.70)),
          (9,(.08,.02,.95,.38)),(9,(.08,.31,.95,.69)),(9,(.05,.61,.98,.99)),
          (10,(.08,.02,.95,.38)),(10,(.08,.31,.95,.70)),(10,(.08,.63,.95,.99)),
          (11,(.02,.05,.70,.47)),(11,(.44,.27,.99,.66)),(11,(.01,.52,.58,.99)),(11,(.44,.54,.99,.99)),
          (13,(.02,.01,.91,.39)),(13,(.02,.29,.83,.70)),(13,(.04,.60,.94,.99)),
          (14,(.06,.48,.99,.99)),(15,(.01,.50,.58,.88)),(15,(.12,.27,.90,.63)),(15,(.38,.01,.99,.38)),(15,(.08,.28,.94,.66)),(15,(.01,.52,.66,.89)),(15,(.18,.66,.99,.99)),
          (16,(.05,.06,.98,.98)),(17,(.04,.01,.97,.58)),(17,(.03,.46,.98,.99))
          ]
          def cover(im,size=(720,500)):
              w,h=size; r=max(w/im.width,h/im.height)
              im=im.resize((round(im.width*r),round(im.height*r)),Image.Resampling.LANCZOS)
              l=(im.width-w)//2; t=(im.height-h)//2
              return im.crop((l,t,l+w,t+h))
          for i,(p,b) in enumerate(crops,1):
              src=Image.open(f"/tmp/food-page-{p:02d}.jpg").convert("RGB")
              W,H=src.size; x0,y0,x1,y1=b
              cr=src.crop((int(W*x0),int(H*y0),int(W*x1),int(H*y1)))
              cr=cover(cr).filter(ImageFilter.UnsharpMask(radius=.75,percent=110,threshold=3))
              cr.save(out/f"food-{i:03d}.jpg",quality=84,optimize=True)

          # ---------------- BAR: one local studio visual for every item ----------------
          class MenuParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.cat="bar"; self.in_h3=False; self.items=[]; self.buf=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="section" and "cat" in a.get("class","").split(): self.cat=a.get("id","bar")
                  if tag=="h3": self.in_h3=True; self.buf=[]
              def handle_endtag(self,tag):
                  if tag=="h3" and self.in_h3:
                      title=re.sub(r"\s+"," ","".join(self.buf)).strip()
                      title=re.sub(r"\s+NEW$","",title).strip()
                      if title:self.items.append((self.cat,title))
                      self.in_h3=False
              def handle_data(self,data):
                  if self.in_h3:self.buf.append(data)
          p=MenuParser(); p.feed(Path("bar.html").read_text(encoding="utf-8"))
          barout=Path("assets/bar/items"); barout.mkdir(parents=True,exist_ok=True)

          font_candidates=[
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          ]
          regular_candidates=[
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf"
          ]
          def getfont(size,bold=True):
              arr=font_candidates if bold else regular_candidates
              for f in arr:
                  if Path(f).exists(): return ImageFont.truetype(f,size)
              return ImageFont.load_default()
          f32=getfont(31); f14=getfont(14); f11=getfont(11,False)

          def kinds(cat,title):
              c=cat.lower(); t=title.lower()
              if "cocktail" in c:return "cocktail"
              if "beer" in c:return "beer"
              if "coffee" in c or "чай" in t or "коф" in t:return "coffee"
              if "soft" in c:return "soft"
              if "champagne" in c or "sparkling" in c:return "sparkling"
              if "wine" in c or "glass" in c:return "wine"
              if "vodka" in c:return "vodka"
              if "gin" in c:return "gin"
              if "rum" in c:return "rum"
              if "tequila" in c:return "tequila"
              if "cognac" in c:return "cognac"
              if any(k in c for k in ("whisky","whiskey","bourbon","irish","scotch","single-malt")):return "whisky"
              if any(k in c for k in ("liqueur","infusion","aperitif")):return "liqueur"
              return "bottle"

          palette={
            "beer":("#714020","#251107"),"wine":("#411514","#120506"),"sparkling":("#365838","#101b10"),
            "vodka":("#8ab8ca","#152a36"),"gin":("#5d907b","#122b23"),"rum":("#a85a22","#2c1307"),
            "tequila":("#d8a23b","#5f300b"),"cognac":("#af4a18","#321005"),"whisky":("#bd651f","#321205"),
            "liqueur":("#80314f","#230912"),"bottle":("#555","#111")
          }

          def gradient(size,top,bottom):
              W,H=size; im=Image.new("RGB",size)
              a=tuple(int(top[i:i+2],16) for i in (1,3,5)); b=tuple(int(bottom[i:i+2],16) for i in (1,3,5))
              px=im.load()
              for y in range(H):
                  q=y/max(1,H-1); row=tuple(round(a[j]*(1-q)+b[j]*q) for j in range(3))
                  for x in range(W):px[x,y]=row
              return im

          def studio(cat,title,idx):
              W,H=520,340
              seed=int(hashlib.sha1(title.encode("utf-8")).hexdigest()[:8],16)
              bg=gradient((W,H),"#24070d","#050304").convert("RGBA")
              d=ImageDraw.Draw(bg,"RGBA")
              d.ellipse((250,-60,570,280),fill=(208,145,82,28))
              d.rectangle((0,272,W,H),fill=(255,255,255,8))
              d.ellipse((275,278,500,319),fill=(0,0,0,80))

              kind=kinds(cat,title); cx,cy=390,170
              if kind=="cocktail":
                  hue=[(202,51,70,230),(221,120,45,230),(112,165,110,230),(172,69,138,230),(214,172,70,230)][seed%5]
                  d.polygon([(330,79),(450,79),(422,212),(358,212)],fill=(245,245,245,30),outline=(255,255,255,150))
                  d.polygon([(338,100),(442,100),(417,204),(363,204)],fill=hue)
                  d.line((390,212,390,274),fill=(255,255,255,180),width=5);d.line((355,277,425,277),fill=(255,255,255,180),width=5)
                  for k in range(5): d.ellipse((350+k*16,135+(k%2)*16,360+k*16,145+(k%2)*16),fill=(255,255,255,95))
              elif kind=="coffee":
                  d.rounded_rectangle((326,135,432,224),radius=18,fill=(238,226,216,255))
                  d.ellipse((338,126,420,149),fill=(68,37,29,255));d.arc((418,146,474,214),270,90,fill=(238,226,216,255),width=14)
              elif kind=="soft":
                  d.rounded_rectangle((342,78,432,245),radius=22,fill=(255,255,255,32),outline=(255,255,255,145),width=3)
                  d.rectangle((348,130,426,239),fill=((194,58,68,205) if seed%2 else (216,126,50,205)))
                  d.line((406,45,390,195),fill=(255,255,255,180),width=5)
              else:
                  c1,c2=palette.get(kind,palette["bottle"])
                  layer=gradient((100,220),c1,c2).convert("RGBA")
                  mask=Image.new("L",(100,220),0);md=ImageDraw.Draw(mask)
                  md.rounded_rectangle((12,72,88,218),radius=18,fill=255);md.rectangle((34,20,66,95),fill=255);md.rounded_rectangle((30,5,70,32),radius=8,fill=255)
                  layer.putalpha(mask);bg.alpha_composite(layer,(340,48))
                  d=ImageDraw.Draw(bg,"RGBA")
                  d.rounded_rectangle((350,145,430,205),radius=7,fill=(238,224,203,245))
                  brand=title.upper()
                  if len(brand)>17:brand=brand[:17]
                  bbox=d.textbbox((0,0),brand,font=f11);tw=bbox[2]-bbox[0]
                  d.text((390-tw/2,163),brand,font=f11,fill=(58,22,30,255))
                  d.line((355,88,355,205),fill=(255,255,255,48),width=6)

              d=ImageDraw.Draw(bg,"RGBA")
              catlabel=cat.replace("-"," ").upper()[:24]
              d.text((24,24),catlabel,font=f11,fill=(218,168,108,255))
              words=title.split(); lines=[]; line=""
              for w in words:
                  test=(line+" "+w).strip()
                  if d.textbbox((0,0),test,font=f32)[2] > 250 and line:
                      lines.append(line);line=w
                  else:line=test
              if line:lines.append(line)
              lines=lines[:3]
              y=66
              for line in lines:
                  d.text((24,y),line,font=f32,fill=(250,242,234,255));y+=38
              d.text((24,302),"УХО & МЕДВЕДЬ · BAR",font=f11,fill=(255,255,255,95))
              return bg.convert("RGB")

          for i,(cat,title) in enumerate(p.items,1):
              studio(cat,title,i).save(barout/f"bar-{i:03d}.jpg",quality=84,optimize=True)

          if len(p.items)!=174:
              raise SystemExit(f"Expected 174 bar items, got {len(p.items)}")
          print("generated",len(crops),"food images and",len(p.items),"bar images")
          PY

          test -s assets/menu/items/food-001.jpg
          test -s assets/menu/items/food-043.jpg
          test -s assets/bar/items/bar-001.jpg
          test -s assets/bar/items/bar-174.jpg

      - name: Publish generated site to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .git/index.lock || true
          git checkout -B gh-pages
          git add -A
          git commit -m "Publish generated menu images [skip ci]" || true
          git push origin gh-pages --force
