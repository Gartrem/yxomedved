<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" role="img" aria-label="Ухо и Медведь">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff5d79"/>
      <stop offset=".55" stop-color="#e62d52"/>
      <stop offset="1" stop-color="#b70d2f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#79ff63"/>
      <stop offset=".55" stop-color="#48d63e"/>
      <stop offset="1" stop-color="#1ca929"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e8e8"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="9" dy="12" stdDeviation="5" flood-color="#000000" flood-opacity=".72"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" letter-spacing="-10" fill="#121212" stroke="#090909" stroke-width="4" stroke-linejoin="round" filter="url(#softShadow)">
    <text x="22" y="121" font-size="138" transform="skewX(-7)">УХО</text>
    <text x="20" y="262" font-size="119" transform="skewX(-7)">МЕДВЕДЬ</text>
    <text x="390" y="115" font-size="111">&amp;</text>
  </g>
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" letter-spacing="-10" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round">
    <text x="12" y="108" font-size="138" transform="skewX(-7)" fill="url(#red)">УХО</text>
    <text x="10" y="247" font-size="119" transform="skewX(-7)" fill="url(#green)">МЕДВЕДЬ</text>
    <text x="377" y="101" font-size="111" fill="url(#white)" letter-spacing="-7">&amp;</text>
  </g>
  <g opacity=".26" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <path d="M60 37c63-24 139-21 220 4"/>
    <path d="M44 160c95-28 226-24 339-5"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.2" filter="url(#glow)">
    <rect x="2" y="2" width="516" height="286" rx="22"/>
  </g>
</svg>